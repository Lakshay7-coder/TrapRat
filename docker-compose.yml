version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kaushal_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: skill_outcome_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kaushal_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kaushal_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: file:./dev.db
      JWT_SECRET: kaushal_sankalp_jwt_access_secret_super_secure_32_chars!
      JWT_REFRESH_SECRET: kaushal_sankalp_jwt_refresh_secret_secure_key_32c!
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: kaushal_web
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api
    depends_on:
      - api

volumes:
  postgres_data:
